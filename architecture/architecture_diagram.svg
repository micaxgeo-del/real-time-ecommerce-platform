  <line class="arrow" x1="1260" y1="662" x2="1340" y2="662"/>

  <text x="70" y="835" fill="#9fb3c8" font-size="17" font-family="Arial">Portfolio project by Micaela Feriale · Data Analytics &amp; Data Engineering</text>
